<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA</title>
</head>
<body>
    <header>
        <nav>
        <ul>
            <li><a href="#/page1">首页一</a></li>
            <li><a href="#/page2">首页二</a></li>
            <li><a href="#/page3">首页三</a></li>
        </ul>
        </nav>
    </header>
    <div id="container">
        <script>
            // 挂载点 只需要动态修改它
            // spa 极大的提升了用户的体验
            class HashRouter {
                constructor(){
                    // this 实例
                    this.routers = {};// 前后端分离的，前端也要有独立的路由
                    // 传统的多页开发，前端没有独立的路由  前端路由集合
                    window.addEventListener('hashchange', 
                    // this 指向事件发生的对象 window
                    // apply call 手动指定this 区别是参数
                    // bind 返回一个全新的函数
                    this.load.bind(this)
                    );
                }
                register(hash,callback){
                    this.routers[hash] = callback;
                }
                load(){
                    // 对象的属性和方法
                    console.log(this);// this-> window 
                    let hash = location.hash.slice(1);// #/page1 -> /page1
                    let handler;
                    if(!hash){

                    }else{
                        handler = this.routers[hash];
                    }
                    // this 对象
                    handler.call(this);
                    // console.log(hash);
                }
            }
            // 前端路由
            let router = new HashRouter();
            let container = document.getElementById('container');
            router.register('#/page1',() => container.innerHTML = '<h1>页面一</h1>');
            router.register('#/page2',() => container.innerHTML = '<h1>页面二</h1>');
            router.register('#/page3',() => container.innerHTML = '<h1>页面三</h1>');

        </script>
    </div>
</body>
</html>
