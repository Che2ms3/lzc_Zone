<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甜甜的日报 - {{DATE}}</title>
<style>
  :root {
    --bg: #f8f9fb;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --border: #e8ecf1;
    --tag-bg: #f1f5f9;
    --tag-text: #475569;
    --accent: #f97316;
    --source-tc: #0a9e5a;
    --source-verge: #3b82f6;
    --source-hn: #f97316;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-hover: 0 4px 12px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.06);
    --radius: 14px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #1e293b 100%);
    color: #fff;
    padding: 48px 24px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 50%, rgba(249,115,22,0.12) 0%, transparent 50%),
                radial-gradient(circle at 70% 50%, rgba(59,130,246,0.10) 0%, transparent 50%);
    animation: headerGlow 8s ease-in-out infinite;
  }
  @keyframes headerGlow {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(2%, -1%); }
  }
  .header-content {
    position: relative;
    z-index: 1;
  }
  .header-icon {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
    filter: drop-shadow(0 2px 8px rgba(249,115,22,0.3));
  }
  .header h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 8px;
  }
  .header h1 .accent {
    color: #fb923c;
  }
  .header .date {
    font-size: 15px;
    color: #94a3b8;
    font-weight: 400;
  }
  .header .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .header .stat-item {
    text-align: center;
  }
  .header .stat-num {
    font-size: 28px;
    font-weight: 700;
    color: #fb923c;
  }
  .header .stat-label {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 2px;
  }

  /* Main container */
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* Tags filter */
  .tag-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .tag-filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: var(--transition);
    font-family: inherit;
  }
  .tag-filter-btn:hover {
    border-color: #fb923c;
    color: #f97316;
  }
  .tag-filter-btn.active {
    background: #f97316;
    color: #fff;
    border-color: #f97316;
  }

  /* Cards */
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card {
    display: flex;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    cursor: pointer;
    transition: var(--transition);
    border: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
  }
  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
    border-color: #d1d5db;
  }
  .card:focus-visible {
    outline: 2px solid #f97316;
    outline-offset: 2px;
  }

  /* Source color bar */
  .card-source-bar {
    width: 5px;
    flex-shrink: 0;
  }
  .card-source-bar.tc { background: var(--source-tc); }
  .card-source-bar.verge { background: var(--source-verge); }
  .card-source-bar.hn { background: var(--source-hn); }

  .card-body {
    padding: 20px 22px;
    flex: 1;
    min-width: 0;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .card-source {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 3px 8px;
    border-radius: 4px;
    color: #fff;
  }
  .card-source.tc { background: var(--source-tc); }
  .card-source.verge { background: var(--source-verge); }
  .card-source.hn { background: var(--source-hn); }

  .card-index {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
  }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.5;
    color: #1e293b;
  }
  .card-summary {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .card-tag {
    font-size: 12px;
    padding: 3px 10px;
    background: var(--tag-bg);
    color: var(--tag-text);
    border-radius: 12px;
    font-weight: 500;
    transition: var(--transition);
  }
  .card-tag:hover {
    background: #e2e8f0;
  }
  .card-arrow {
    display: flex;
    align-items: center;
    padding: 0 18px;
    color: #cbd5e1;
    font-size: 20px;
    transition: var(--transition);
    flex-shrink: 0;
  }
  .card:hover .card-arrow {
    color: #f97316;
    transform: translateX(2px);
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 32px 20px 48px;
    color: var(--text-muted);
    font-size: 13px;
    border-top: 1px solid var(--border);
    max-width: 780px;
    margin: 0 auto;
  }
  .footer .sources {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .footer .source-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .source-dot.tc { background: var(--source-tc); }
  .source-dot.verge { background: var(--source-verge); }
  .source-dot.hn { background: var(--source-hn); }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  @media (max-width: 640px) {
    .header h1 { font-size: 24px; }
    .card-title { font-size: 15px; }
    .card-body { padding: 16px; }
    .card-arrow { display: none; }
    .header .stats-bar { gap: 20px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-content">
    <span class="header-icon">🍩</span>
    <h1><span class="accent">甜甜</span>的日报</h1>
    <div class="date">{{DATE_DISPLAY}}</div>
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-num">{{TOTAL_COUNT}}</div>
        <div class="stat-label">精选资讯</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">{{SOURCE_COUNT}}</div>
        <div class="stat-label">覆盖来源</div>
      </div>
      <div class="stat-item">
        <div class="stat-num">{{TAG_COUNT}}</div>
        <div class="stat-label">关键标签</div>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <!-- 标签筛选栏 -->
  <div class="tag-filter">
    <button class="tag-filter-btn active" onclick="filterByTag('all')">全部</button>
    {{TAG_FILTER_BUTTONS}}
  </div>

  <!-- 资讯卡片列表 -->
  <div class="card-list">
    {{CARD_LIST}}
  </div>
</div>

<div class="footer">
  <div class="sources">
    <span><span class="source-dot tc"></span>TechCrunch</span>
    <span><span class="source-dot verge"></span>The Verge</span>
    <span><span class="source-dot hn"></span>Hacker News</span>
  </div>
  <p>甜甜的日报 · 每日AI精选 · {{DATE_DISPLAY}} · 由 AI 自动生成，仅供参考</p>
</div>

<script>
function filterByTag(tag) {
  document.querySelectorAll('.tag-filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === tag || (tag === 'all' && btn.textContent === '全部'));
  });
  document.querySelectorAll('.card').forEach(card => {
    if (tag === 'all') {
      card.style.display = '';
      return;
    }
    const tags = card.dataset.tags || '';
    card.style.display = tags.split(',').includes(tag) ? '' : 'none';
  });
}
</script>

</body>
</html>
